<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vo Thanh Dat</title>
</head>
<body>
    <h1>Form dang ky su kien</h1>

    <form>
        <label>Ho ten:</label>
        <input type="text">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>
        <label>Thoi gian tham gia:</label>
        <input type="datetime-local">
        <br><br>
        <label>Gioi tinh:</label>
        <input type="radio" name="gender"> Nam
        <input type="radio" name="gender"> Nu
        <br><br>
        <label>So thich:</label>
        <input type="checkbox"> Di ngu
        <input type="checkbox"> Di choi
        <input type="checkbox"> Di nhau
        <br><br>
        <button type="submit">Xac nhan</button>
    </form>
</body>
</html>
