<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vo Thanh Dat</title>
</head>
    <style>
        body {
            background-color: #e9ecef;
            padding: 20px;
        }
        .menu {
            background-color: #f5deb3;
            border: 3px solid #8b4513;
            border-radius: 15px;
            padding: 20px;
            width: 350px;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #8b0000;
            text-align: center;
            font-size: 24px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        .ten_mon {
            color: #000000;
            font-size: 18px;
        }
        .gia_mon {
            color: #d84315;
            font-size: 18px;
            font-weight: bold;
        }
        button {
            background-color: #8b4513;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #a0522d;
        }
    </style>
</head>
<body>
  <center>  <div class="menu">
        <h1>MENU QUAN CA PHE</h1>
        <ul>
            <li>
                <span class="ten_mon">Ca phe den</span>
                <span class="gia_mon">20.000d</span>
            </li>
            <li>
                <span class="ten_mon">Ca phe sua da</span>
                <span class="gia_mon">25.000d</span>
            </li>
            <li>
                <span class="ten_mon">Bac xiu</span>
                <span class="gia_mon">30.000d</span>
            </li>
            <li>
                <span class="ten_mon">Tra dao cam sa</span>
                <span class="gia_mon">35.000d</span>
            </li>
            <li>
                <span class="ten_mon">Sinh to bo</span>
                <span class="gia_mon">40.000d</span>
            </li>
        </ul>
        <button>Dat ngay</button>
    </div>
    </center>
</body>
</html>
